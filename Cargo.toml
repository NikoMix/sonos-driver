# Workspace root for the sonos-driver project.
#
# A pure-Rust, user-mode Windows -> Sonos audio bridge organised as a set of
# small, single-responsibility crates that build against the stable trait
# contracts exposed by `audio-core`.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NikoMix/sonos-driver"
homepage = "https://github.com/NikoMix/sonos-driver"
authors = ["NikoMix"]
keywords = ["sonos", "audio", "wasapi", "streaming", "windows"]
categories = ["multimedia::audio", "network-programming"]

# Internal crate path dependencies are declared once here and inherited by
# members via `package.workspace = true` / `<dep>.workspace = true`.
[workspace.dependencies]
audio-core = { path = "crates/audio-core", version = "0.2.0" }
audio-capture = { path = "crates/audio-capture", version = "0.2.0" }
audio-pipeline = { path = "crates/audio-pipeline", version = "0.2.0" }
audio-codec = { path = "crates/audio-codec", version = "0.2.0" }
stream-server = { path = "crates/stream-server", version = "0.2.0" }
sonos-control = { path = "crates/sonos-control", version = "0.2.0" }
sonos-vad-control = { path = "crates/sonos-vad-control", version = "0.2.0" }
sonos-vad-endpoint = { path = "crates/sonos-vad-endpoint", version = "0.2.0" }
sonos-driver-core = { path = "crates/sonos-driver-core", version = "0.2.0" }
sonos-routing = { path = "crates/sonos-routing", version = "0.2.0" }
sonos-cast-service = { path = "crates/sonos-cast-service", version = "0.2.0" }
sonos-vad-service = { path = "crates/sonos-vad-service", version = "0.2.0" }

# Shared third-party dependencies. Versions are intentionally permissive
# (major-version floors) and locked precisely by Cargo.lock; `cargo update`
# plus `cargo audit`/`cargo deny` keep them current and vulnerability-free.
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# CLI signal handling (WS-G). `ctrlc` registers the OS Ctrl-C / console-close
# handler in safe code, so the CLI keeps `#![forbid(unsafe_code)]`. Permissive
# (MIT OR Apache-2.0), cross-platform, and cargo-deny validated.
ctrlc = "3"
# Machine-readable output for scripting (`list --json`). MIT/Apache-2.0.
serde_json = "1"

# Audio DSP. `rubato` is the high-quality, real-time-safe resampler; its buffer
# adapters come from `audioadapter-buffers`. The version floor is pinned to the
# major `rubato` depends on so Cargo unifies on a single, trait-compatible
# `audioadapter` graph (rubato 3.x requires the `^3.0` adapters). Both are
# permissively licensed (MIT / MIT OR Apache-2.0) and cargo-deny validated.
rubato = "3"
audioadapter-buffers = "3"

# Audio codecs. `flacenc` is the pure-Rust FLAC encoder (Apache-2.0); default
# features (log/par/serde) are disabled so the per-frame streaming path stays
# single-threaded, dependency-light and deterministic. `claxon` is a zero-dep
# pure-Rust FLAC decoder used only by the round-trip tests (dev-dependency).
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4.3"

# Async stream-server (WS-C). Major-version floors; `Cargo.lock` pins the exact
# latest patch, kept current by `cargo update` and clean by `cargo deny`/`audit`.
# No TLS is pulled in: Sonos dials the bridge over plain HTTP on the LAN.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio-stream = "0.1"
bytes = "1"

# Networking & XML for Sonos SSDP discovery and UPnP SOAP control (WS-B).
# `socket2` only configures the multicast UDP socket (reuse/TTL/bind); the socket
# is then converted to `std::net::UdpSocket` so all recv/send stays in safe code
# under `#![forbid(unsafe_code)]`. `quick-xml` (+ serde) parses the device
# description and zone-group topology. No TLS: Sonos LAN control is plain HTTP.
# `if-addrs` enumerates local IPv4 interfaces so the SSDP M-SEARCH is sent on
# every network the host is attached to (multi-homed Windows hosts otherwise send
# discovery out only the default-route adapter and find no rooms). It adds no new
# transitive crates (libc/windows-sys are already present) and is MIT/BSD-3.
socket2 = "0.6"
quick-xml = { version = "0.40", features = ["serialize"] }
if-addrs = "0.15"

# Windows API bindings for WASAPI loopback capture (WS-A, `audio-capture` only).
# Pinned to the latest release and locked by Cargo.lock; MIT/Apache-licensed.
# Only the Win32 sub-namespaces the capture path needs are enabled to keep build
# times and the API surface tight.
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

# Core windows-rs runtime (COM `IUnknown`, `Interface`, `#[implement]` support).
# Re-exported by the umbrella `windows` crate above, but also referenced directly
# so the `#[implement]` macro's generated `::windows_core` paths resolve. Pinned
# to the exact same release as `windows` so Cargo unifies the two and the COM
# vtable/`IUnknownImpl` types stay identical. MIT/Apache-licensed.
windows-core = { version = "0.62", default-features = true }

# Windows Service Control Manager integration for the headless `sonosvad-svc`
# host (WS-K). Hand-rolling `StartServiceCtrlDispatcherW` +
# `RegisterServiceCtrlHandlerExW` + the `SetServiceStatus` state machine is
# perfectly possible, but the failure mode of getting the checkpoint/wait-hint
# transitions subtly wrong is a service the SCM believes is hung (error 1053) --
# so this is exactly the fiddly, well-bounded problem a maintained crate should
# own. MIT OR Apache-2.0, maintained by Mullvad, cargo-deny validated.
windows-service = "0.8"

# Desktop GUI stack for the `sonos-driver-gui` system-tray application (WS-J).
# Every crate here is permissively licensed (MIT OR Apache-2.0) and cargo-deny
# validated. `eframe` drives an immediate-mode `egui` UI on its bundled `winit`
# Win32 event loop; the light `glow` (OpenGL) renderer is selected with
# `default-features = false` to keep the `wgpu` graphics stack — and its larger
# dependency/advisory surface — out of the tree. `tray-icon` + `muda` add the
# Windows system-tray icon and context menu; their Linux-only `gtk`/`libxdo`
# default features are disabled. `image` decodes the embedded PNG used for the
# tray and window icons, with only the `png` codec enabled.
egui = "0.34"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "0.24", default-features = false }
muda = { version = "0.19", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

# Centralised lint policy. Every member opts in with `[lints] workspace = true`.
# CI promotes these warnings to hard errors (`-D warnings`), keeping the tree
# clean with minimal supervision while surfacing code-smell telemetry early.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Stylistic / documentation lints that add friction without improving
# correctness for this codebase. Error and panic docs are added with the real
# implementations in each workstream.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Optimise release builds for the real-time audio path.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
