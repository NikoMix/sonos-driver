# The Sonos Router desktop app: a routing table between every Windows audio
# output and every Sonos room, applied while it runs. Split into a headless,
# unit-tested library (`sonos_driver_gui`) and a thin rendering binary.
[package]
name = "sonos-driver-gui"
description = "Desktop app that routes each Windows audio output to a Sonos room, with no driver."
# The GUI stack (eframe 0.34) is edition-2024 and requires rustc 1.92, so this
# member overrides the workspace MSRV floor of 1.90 while inheriting every other
# package field. The pinned toolchain (stable) is newer than both.
rust-version = "1.92"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["sonos", "audio", "gui", "tray", "windows"]
categories = ["multimedia::audio", "gui"]

[lints]
workspace = true

[lib]
name = "sonos_driver_gui"
path = "src/lib.rs"

[[bin]]
name = "sonos-router"
path = "src/main.rs"

[dependencies]
# The routing model and the multi-route streaming worker: the app is a UI for
# exactly the engine the driverless CLI and the `sonoscast` service already run,
# so a route behaves identically however it was configured.
sonos-cast-service.workspace = true
sonos-routing.workspace = true
sonos-driver-core.workspace = true
audio-core.workspace = true
# Render-endpoint enumeration for the outputs list (binary only). The public
# `enumerate_render_endpoints()` initialises COM itself, so it is called from a
# worker thread; on non-Windows it returns an error handled gracefully.
audio-capture.workspace = true

# Configuration persistence + structured diagnostics (existing workspace deps).
serde = { workspace = true }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Desktop GUI stack (see the root `[workspace.dependencies]` for the rationale
# behind the disabled default features).
egui.workspace = true
eframe.workspace = true
tray-icon.workspace = true
muda.workspace = true
image.workspace = true

# Querying whether the optional `sonosvad` service is installed and running, so
# the app can tell the user when the two modes overlap. Query-status access
# needs no elevation. Safe wrapper, so `forbid(unsafe_code)` still holds.
[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
