# cargo-deny configuration: enforce supply-chain hygiene.
# Run with `cargo deny check`. CI fails on advisories or disallowed licenses.

[advisories]
version = 2
# Fail the build on any known vulnerability. `cargo audit` is run additionally.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. No copyleft/commercial-license dependencies are
# permitted: if a capability is only available under such terms, it is built
# in-house instead (per project policy).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
]
# Per-crate exceptions: these licenses are permissive / OSI-approved / FSF-libre
# (no copyleft, no commercial restriction) but are not broad enough to add to the
# global allow-list. Each is scoped to the single transitive crate that carries it
# and is intrinsic to the GUI stack (eframe/egui 0.34):
#   * clipboard-win / error-code (BSL-1.0, Boost): pulled by arboard, which
#     egui-winit hard-codes via `features = ["clipboard"]` in eframe -- it cannot
#     be disabled through Cargo features. BSL-1.0 is more permissive than MIT.
#   * epaint_default_fonts (OFL-1.1 + Ubuntu-font-1.0): the bundled egui default
#     fonts (`default_fonts` feature). Both are permissive open-font licenses that
#     allow embedding and redistribution in software.
exceptions = [
    { allow = ["BSL-1.0"], crate = "clipboard-win" },
    { allow = ["BSL-1.0"], crate = "error-code" },
    { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]
confidence-threshold = 0.9
# The allow-list is intentionally forward-looking (FLAC and other audio deps
# commonly add BSD/Zlib/ISC). Don't warn about entries no current dependency uses.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Known-problematic or license-encumbered crates are denied outright.
deny = []
# Not a real duplicate: our internal path crate is `audio-core` 0.1.0, while the
# unrelated crates.io crate of the same name (`audio-core` 0.2.1, by udoprog) is
# pulled transitively by rubato -> audioadapter. Both are permissively licensed;
# skip the benign name-collision warning so the gate output stays intentional.
skip = [
    { crate = "audio-core@0.2.1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
