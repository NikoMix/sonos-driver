name: Feature request
description: Suggest a capability or enhancement.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to achieve? What is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the capability. Note any licensing constraints (the project uses permissive-licensed dependencies only).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This does not require a paid/commercial-license dependency.
        - label: This is consistent with the documented latency reality (docs/LATENCY-BUDGET.md).
