name: Release

# Build and publish a portable Windows release archive.
#
# NOTE: GitHub Actions is currently billing-blocked on this private repository (runners
# fail to start), so this workflow does not execute yet. It is kept correct and ready for
# when the owner makes the repo public, raises the Actions spending limit, or adds a
# self-hosted runner. Until then, releases are cut locally — see docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: Build & package (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build & package portable zip
        shell: pwsh
        run: ./scripts/package.ps1 -OutputDir dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonos-driver-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          if (-not $zip) { throw "No release archive found in dist/." }
          gh release create $env:GITHUB_REF_NAME $zip.FullName `
            --title "sonos-driver $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
