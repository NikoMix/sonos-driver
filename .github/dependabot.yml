version: 2
updates:
  # Rust crate dependencies across the whole workspace.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # Batch low-risk patch/minor bumps to reduce PR noise.
      patches:
        update-types:
          - patch
          - minor

  # GitHub Actions used by the CI/CodeQL workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci"
